# Run from the repo root:  docker compose -f deploy/docker-compose.yml up -d
services:
  ollama:
    image: ollama/ollama:0.40.2
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_NUM_PARALLEL=1
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Pulls the model once, then exits.
  ollama-pull:
    image: ollama/ollama:0.40.2
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: ["ollama", "pull", "${GEMMA_MODEL:-gemma3:4b}"]
    restart: "no"

  worker:
    build:
      context: ..
      dockerfile: deploy/worker.Dockerfile
    restart: unless-stopped
    # A fixed hostname keeps the server's identity stable when the container is recreated, and the drain
    # (final login upload and lease release for every account) needs longer than Docker's default 10 s.
    hostname: nothing-bot-server-worker
    stop_grace_period: 90s
    depends_on:
      ollama:
        condition: service_healthy
    env_file: ../apps/worker/.env
    environment:
      - OLLAMA_URL=http://ollama:11434
      - FIREBASE_SERVICE_ACCOUNT=/secrets/service-account.json
      - WWEBJS_DATA=/data/wwebjs
      - NBS_SERVER_ID=${NBS_SERVER_ID:-${SPOT_SERVER_ID:-nothing-bot-server-worker}}
    volumes:
      - wwebjs:/data
      - ../apps/worker/service-account.json:/secrets/service-account.json:ro
    shm_size: "512mb"

volumes:
  ollama:
  wwebjs:
