<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<!-- Source for apps/web/public/press/cover.jpg (the DEV post cover, 1000x420). Render at 1000x420, device scale factor 2, then export JPEG. -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root { --bg: #0a0a0a; --green: #7ddc5a; --ink: #f2f2f2; --muted: #a8a8a8; --line: #2e2e2e; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1000px; height: 420px; overflow: hidden; background: var(--bg); font-family: "Poppins", system-ui, sans-serif; color: var(--ink); }
  #stage { position: relative; width: 1000px; height: 420px; overflow: hidden;
    background:
      radial-gradient(520px 360px at 760px 120px, rgba(125,220,90,.16), transparent 70%),
      radial-gradient(700px 420px at 0 460px, rgba(125,220,90,.07), transparent 70%),
      var(--bg); }
  .logo { position: absolute; left: 48px; top: 44px; width: 60px; height: 60px; border-radius: 15px; border: 1px solid var(--line); overflow: hidden; }
  .logo img { display: block; width: 60px; height: 60px; }
  .kicker { position: absolute; left: 48px; top: 126px; font-size: 12px; letter-spacing: .14em; font-weight: 600; color: var(--green); text-transform: uppercase; }
  .name { position: absolute; left: 48px; top: 150px; font-size: 46px; line-height: 1.04; font-weight: 800; letter-spacing: -.02em; }
  .sub { position: absolute; left: 48px; top: 262px; width: 360px; font-size: 16px; line-height: 1.45; color: var(--muted); font-weight: 500; }
  .sub b { color: var(--ink); font-weight: 600; }
  .chip { position: absolute; left: 48px; top: 340px; display: inline-flex; align-items: center; gap: 8px; padding: 7px 13px; border-radius: 999px; background: rgba(125,220,90,.12); color: var(--green); font-size: 12.5px; font-weight: 600; }
  .chip i { width: 7px; height: 7px; border-radius: 50%; background: var(--green); display: block; }
  .win { position: absolute; left: 452px; top: 52px; width: 600px; height: 375px; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); box-shadow: 0 24px 60px rgba(0,0,0,.6), 0 0 0 1px rgba(125,220,90,.06); }
  .win img { display: block; width: 600px; height: 375px; }
</style>
</head>
<body>
<div id="stage">
  <div class="logo"><img src="../../apps/web/public/brand/logo.svg" alt="" /></div>
  <div class="kicker">Slow and steady · Open-mic curation</div>
  <div class="name">Nothing BOT<br/>Curating</div>
  <div class="sub">WhatsApp spot requests, sorted by <b>Gemma</b> on an old laptop.</div>
  <div class="chip"><i></i>Runs locally · no cloud AI reads your chats</div>
  <div class="win"><img src="../../apps/web/public/press/lineup-after.jpg" alt="" /></div>
</div>
</body>
</html>
