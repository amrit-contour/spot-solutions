<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<title>Spot Server</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wdth,wght@8..144,25..151,300..800&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --primary: #7a5416; --on-primary: #fff; --primary-c: #ffddb0; --on-primary-c: #2a1800;

    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --primary: #f2bc6e; --on-primary: #432c00; --primary-c: #5f4100; --on-primary-c: #ffddb0;
    --tertiary-c: #3a4b33; --on-tertiary-c: #d7e8cd;
    --error: #ffb4ab; --error-c: #93000a; --on-error-c: #ffdad6;
    --surface: #18120c; --s-low: #211a14; --s-cont: #251e18; --s-high: #302822; --s-highest: #3b332c;
    --on-surface: #ede0d5; --on-surface-v: #d5c4b5; --outline-v: #51453a; --ok: #3fb950; --chart-2: #6fcfc8;
    color-scheme: dark;
  } }
  :root[data-theme="dark"] {
    --primary: #f2bc6e; --on-primary: #432c00; --primary-c: #5f4100; --on-primary-c: #ffddb0;
    --tertiary-c: #3a4b33; --on-tertiary-c: #d7e8cd;
    --error: #ffb4ab; --error-c: #93000a; --on-error-c: #ffdad6;
    --surface: #18120c; --s-low: #211a14; --s-cont: #251e18; --s-high: #302822; --s-highest: #3b332c;
    --on-surface: #ede0d5; --on-surface-v: #d5c4b5; --outline-v: #51453a; --ok: #3fb950; --chart-2: #6fcfc8;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--surface); color: var(--on-surface); font: 400 15px/1.45 "Roboto Flex", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  main { max-width: 1040px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: clamp(24px, 6.5vw, 34px); overflow-wrap: anywhere; line-height: 1.15; font-weight: 550; letter-spacing: -.015em; font-variation-settings: "wdth" 115, "opsz" 48; margin: 0; }
  h2 { font-size: 17px; font-weight: 600; margin: 0 0 12px; }
  .muted { color: var(--on-surface-v); }
  .small { font-size: 13px; }
  .mono { font-family: "Roboto Mono", monospace; font-size: 13px; }
  header { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; margin-bottom: 24px; }
  .logo { width: 48px; height: 48px; flex: none; }
  .grow { flex: 1; min-width: 0; }
  .grid { display: grid; gap: 16px; }
  @media (min-width: 760px) { .g2 { grid-template-columns: 1fr 1fr; } .g4 { grid-template-columns: repeat(4, 1fr); } }
  .g4 { grid-template-columns: repeat(2, 1fr); }
  .card { background: var(--s-low); border-radius: 16px; padding: 20px; }
  .card.tight { padding: 0; overflow: hidden; }
  .chip { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 8px; font-size: 12px; font-weight: 600; letter-spacing: .03em; }
  .chip.ok { background: var(--tertiary-c); color: var(--on-tertiary-c); }
  .chip.bad { background: var(--error-c); color: var(--on-error-c); }
  .chip.neutral { border: 1px solid var(--outline-v); color: var(--on-surface-v); }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .dot.ok { background: var(--ok); } .dot.bad { background: var(--error); }
  .row { display: flex; align-items: center; gap: 12px; padding: 14px 20px; }
  .row + .row { border-top: 1px solid color-mix(in srgb, var(--outline-v) 50%, transparent); }
  .meter { height: 8px; border-radius: 99px; background: var(--s-highest); overflow: hidden; margin-top: 10px; }
  .mrow + .mrow { margin-top: 20px; }
  .mfoot { margin-top: 20px; padding-top: 14px; border-top: 1px solid color-mix(in srgb, var(--outline-v) 50%, transparent); }

  .stat b { font-weight: 600; font-size: 14px; }
  button, .btn { appearance: none; border: 0; cursor: pointer; font: 600 14px "Roboto Flex", sans-serif; letter-spacing: .01em; height: 40px; padding: 0 18px; border-radius: 99px; background: var(--primary); color: var(--on-primary); transition: transform .16s cubic-bezier(.23,1,.32,1), opacity .15s; display: inline-flex; align-items: center; gap: 8px; }
  button:active:not(:disabled) { transform: scale(.97); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button.tonal { background: var(--primary-c); color: var(--on-primary-c); }
  button.text, .btn.text { background: transparent; color: var(--primary); padding: 0 12px; }
  button.sm { height: 32px; padding: 0 12px; font-size: 12px; }
  input[type=text], input[type=password], textarea { width: 100%; font: inherit; color: inherit; background: transparent; border: 1px solid var(--outline-v); border-radius: 8px; padding: 10px 14px; outline: none; }

  .step { display: flex; gap: 14px; align-items: flex-start; padding: 14px 0; }
  .step + .step { border-top: 1px solid color-mix(in srgb, var(--outline-v) 50%, transparent); }

  .num.done { background: var(--primary); color: var(--on-primary); }

  .drop:hover, .drop.over { border-color: var(--primary); background: color-mix(in srgb, var(--primary) 6%, transparent); }
  pre.logs { margin: 0; max-height: 420px; overflow: auto; padding: 16px 20px; background: var(--s-cont); font: 12px/1.55 "Roboto Mono", monospace; white-space: pre-wrap; word-break: break-word; }

  .models { display: flex; flex-wrap: wrap; gap: 6px; }
  .locked { text-align: center; padding: 80px 16px; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  pre.qr { margin: 0; padding: 14px; background: #000; color: #fff; font: 10px/1 ui-monospace, Menlo, Consolas, monospace; border-radius: 12px; letter-spacing: 0; }
  .theme { display: inline-flex; background: var(--s-high); border-radius: 999px; padding: 3px; gap: 2px; }
  .theme button { background: none; color: var(--on-surface-v); border: 0; border-radius: 999px; padding: 6px 12px; font: 500 13px/1 inherit; cursor: pointer; min-height: 0; }
  .theme button[aria-pressed="true"] { background: var(--primary-c); color: var(--on-primary-c); }
  details.sec > summary { list-style: none; display: flex; align-items: center; gap: 10px; cursor: pointer; }

  details.sec.stack > .secbody { display: block; padding-top: 4px; }
  /* Cards in one row share the row's height; a collapsed one stays header-sized instead of stretching into an empty box. */
  .grid > details.sec:not([open]) { align-self: start; }

  details.sec > summary .sum { margin-left: auto; }

  details.sec[open] > summary .chev { transform: rotate(45deg); }
  details.sec[open] > summary { margin-bottom: 12px; }

  details.sec.tight > summary { padding: 20px; }
  details.sec.tight[open] > summary { padding-bottom: 8px; margin-bottom: 0; }
  @media (prefers-reduced-motion: reduce) { details.sec > summary .chev { transition: none; } }

  /* ---- setup, updates, AI models ---- */
  .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 14px; }
  .actions .btn { text-decoration: none; }
  a.btn { background: var(--primary); color: var(--on-primary); }

  .row2 { display: flex; align-items: center; gap: 12px; margin-top: 10px; }

  .secbody > .row2:first-child { margin-top: 0; }
  .blk + .blk { margin-top: 20px; padding-top: 20px; border-top: 1px solid color-mix(in srgb, var(--outline-v) 50%, transparent); }
  .fieldrow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 10px; }
  .fieldrow > input { flex: 1 1 200px; min-width: 0; width: auto; }
  .err-text { color: var(--error); }
  .spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid color-mix(in srgb, currentColor 25%, transparent); border-top-color: currentColor; animation: spin .8s linear infinite; display: inline-block; vertical-align: -2px; flex: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin { animation-duration: 2.4s; } }
  .banner { display: flex; align-items: center; gap: 14px; padding: 16px 20px; border-radius: 16px; background: var(--primary-c); color: var(--on-primary-c); }
  .banner.bad { background: var(--error-c); color: var(--on-error-c); }
  .banner .small { margin-top: 2px; opacity: .85; }
  .banner button { background: var(--primary); color: var(--on-primary); flex: none; }
  .banner.bad button { background: var(--error); color: var(--surface); }
  .panel { border: 1px solid var(--outline-v); border-radius: 12px; padding: 16px; }
  .panel + details.alt, details.alt + details.alt { margin-top: 10px; }
  .panel + details.alt { margin-top: 14px; }
  details.alt { border-top: 1px solid color-mix(in srgb, var(--outline-v) 50%, transparent); padding-top: 12px; }
  details.alt > summary { cursor: pointer; font-weight: 600; font-size: 14px; color: var(--on-surface-v); }
  details.alt[open] > summary { margin-bottom: 8px; }
  .conn { display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start; }
  .conn .grow { min-width: 240px; }
  ol.steps { margin: 6px 0 0; padding-left: 20px; }
  ol.steps li + li { margin-top: 2px; }
  .check { background: var(--primary-c); color: var(--on-primary-c); padding: 1px 8px; border-radius: 6px; letter-spacing: .1em; }
  .linkbox { margin-top: 12px; padding: 10px 12px; border-radius: 8px; background: var(--s-cont); word-break: break-all; user-select: all; }
  .qrbox { width: 176px; height: 176px; flex: none; border-radius: 12px; overflow: hidden; background: #fff; line-height: 0; }
  .qrbox svg { width: 100%; height: 100%; display: block; }
  .dd { position: relative; flex: 1 1 220px; min-width: 0; }
  .dd-btn { width: 100%; height: 40px; justify-content: space-between; background: transparent; color: var(--on-surface); border: 1px solid var(--outline-v); border-radius: 8px; padding: 0 14px; font-weight: 400; }
  .dd-btn:hover:not(:disabled) { border-color: var(--on-surface-v); }
  .dd-btn[aria-expanded="true"] { border-color: var(--primary); box-shadow: inset 0 0 0 1px var(--primary); }
  .dd-btn > span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dd-btn .chev { width: 8px; height: 8px; border-right: 2px solid var(--on-surface-v); border-bottom: 2px solid var(--on-surface-v); transform: rotate(45deg) translateY(-2px); flex: none; }
  .dd-list { position: absolute; z-index: 20; left: 0; right: 0; top: calc(100% + 4px); margin: 0; padding: 6px; list-style: none; max-height: 264px; overflow: auto; background: var(--s-high); border: 1px solid var(--outline-v); border-radius: 12px; box-shadow: 0 8px 24px rgb(0 0 0 / .18); }
  .dd-list li { padding: 9px 10px; border-radius: 8px; cursor: pointer; font: 13px "Roboto Mono", monospace; outline: none; }
  .dd-list li:hover, .dd-list li:focus { background: var(--s-highest); }
  .dd-list li.sel { background: var(--primary-c); color: var(--on-primary-c); }
  .dd-list li.empty { cursor: default; color: var(--on-surface-v); font-family: inherit; }
  .opts { display: grid; gap: 8px; margin-top: 12px; }
  .opt { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border: 1px solid var(--outline-v); border-radius: 12px; cursor: pointer; margin: 0; font-weight: 400; color: inherit; }
  .opt > span { display: flex; flex-direction: column; gap: 2px; }
  .opt.on { border-color: var(--primary); background: color-mix(in srgb, var(--primary) 8%, transparent); }
  .opt.off { opacity: .45; cursor: not-allowed; }
  .opt input { margin: 3px 0 0; accent-color: var(--primary); flex: none; }
  .list { margin-top: 10px; }
  .li { margin-top: 0; padding: 10px 0; }
  .li + .li { border-top: 1px solid color-mix(in srgb, var(--outline-v) 50%, transparent); }
  .switch { position: relative; width: 48px; height: 28px; padding: 0; border-radius: 99px; background: var(--s-highest); border: 1px solid var(--outline-v); flex: none; transition: background .15s; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--on-surface-v); transition: transform .2s cubic-bezier(.23,1,.32,1), background .15s; }
  .switch[aria-checked="true"] { background: var(--primary); border-color: var(--primary); }
  .switch[aria-checked="true"]::after { transform: translateX(20px); background: var(--on-primary); }
  @media (prefers-reduced-motion: reduce) { .switch::after { transition: none; } }

  /* ---- live dashboard ---- */
  .dot.warn { background: var(--primary); }
  .tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  @media (min-width: 560px) { .tiles { grid-template-columns: repeat(3, 1fr); } }
  @media (min-width: 900px) { .tiles { grid-template-columns: repeat(6, 1fr); } }
  .tile { appearance: none; border: 1px solid transparent; height: auto; min-width: 0; padding: 12px 14px; border-radius: 12px; background: var(--s-cont); color: var(--on-surface); font: 400 13px/1.35 "Roboto Flex", system-ui, sans-serif; letter-spacing: 0; display: flex; flex-direction: column; align-items: flex-start; justify-content: flex-start; gap: 2px; text-align: left; cursor: default; transition: background .15s, border-color .15s, transform .16s cubic-bezier(.23,1,.32,1); }
  button.tile { cursor: pointer; }
  button.tile:hover { border-color: var(--outline-v); }
  button.tile[aria-pressed="true"] { background: var(--primary-c); color: var(--on-primary-c); }
  button.tile:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  .tile .tl { font-size: 12px; font-weight: 600; letter-spacing: .02em; opacity: .8; }
  .tile .tv { font-size: 28px; line-height: 1.15; font-weight: 600; font-variant-numeric: tabular-nums; font-variation-settings: "wdth" 110, "opsz" 36; }
  .tile .tv.bad { color: var(--error); }
  .tile .tf { font-size: 12px; opacity: .75; overflow-wrap: anywhere; }
  .lv { margin-top: 16px; }
  .lv-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 12px; }
  .plot { height: 104px; margin-top: 10px; }
  .plot svg { display: block; width: 100%; height: 100%; --bar: var(--primary); }
  .plot svg.m-sent { --bar: var(--chart-2); }
  .plot svg.m-err { --bar: var(--error); }
  .plot .grid-l { stroke: color-mix(in srgb, var(--outline-v) 60%, transparent); stroke-width: 1; vector-effect: non-scaling-stroke; }
  .plot .bar { fill: var(--bar); }
  .plot .bar.now { opacity: .6; }
  .plot .zero { fill: var(--outline-v); }
  .plot .hit { fill: transparent; }
  .plot g:hover .hit { fill: color-mix(in srgb, var(--on-surface) 7%, transparent); }
  .axis { position: relative; height: 18px; margin-top: 4px; font-size: 11px; color: var(--on-surface-v); }
  .axis span { position: absolute; top: 0; transform: translateX(-50%); white-space: nowrap; }
  .lv-panels { display: grid; gap: 12px; margin-top: 16px; }
  @media (min-width: 760px) { .lv-panels { grid-template-columns: 1fr 1fr; } }
  .lv-panels .panel { height: 100%; }
  .kv { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 8px 0; font-size: 13px; }
  .kv + .kv { border-top: 1px solid color-mix(in srgb, var(--outline-v) 40%, transparent); }
  .kv > span:first-child { color: var(--on-surface-v); }
  .kv > b { font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; overflow-wrap: anywhere; }
  .meter.split { display: flex; margin-top: 4px; }
  .meter.split > i { transition: width .5s cubic-bezier(.23,1,.32,1); }
  .meter.split > i + i { background: var(--chart-2); }
  .acclist { max-height: 420px; overflow: auto; }
  .acc { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; align-items: center; gap: 4px 12px; padding: 12px 0; }
  .acc + .acc { border-top: 1px solid color-mix(in srgb, var(--outline-v) 50%, transparent); }
  .acc .who { min-width: 0; }
  .acc .who b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .acc .who > div { overflow-wrap: anywhere; }
  .acc .who b { display: block; }
  .acc .nums { color: var(--on-surface-v); font-variant-numeric: tabular-nums; white-space: nowrap; }
  @media (max-width: 640px) { .acc { grid-template-columns: auto minmax(0, 1fr) auto; } .acc .nums { grid-column: 2 / -1; white-space: normal; } }
  .dimmed { opacity: .55; }
  .empty { padding: 18px 0 6px; }
</style>
</head>
<body>
<main id="app"><p class="muted">Loading…</p></main>
<div class="toast" id="toast"></div>
<script>
const $ = (s) => document.querySelector(s);
const fmt = (b) => b >= 1e12 ? (b / 1e12).toFixed(1) + " TB" : b >= 1e9 ? (b / 1e9).toFixed(1) + " GB" : Math.round(b / 1e6) + " MB";
const up = (s) => { const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60); return d ? `${d}d ${h}h` : h ? `${h}h ${m}m` : `${m}m`; };
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 3500); }
async function api(path, body) {
  const r = await fetch(path, body ? { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) } : {});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(j.error || r.statusText), { status: r.status });
  return j;
}
const meter = (label, used, total, detail) => {
  const p = total ? Math.min(1, used / total) : 0;
  return `<div class="mrow"><div class="stat"><span>${label}</span><span class="muted">${detail}</span></div><div class="meter"><i class="${p > .9 ? "warn" : ""}" style="width:${(p * 100).toFixed(1)}%"></i></div></div>`;
};
const logo = `<svg class="logo" viewBox="0 0 48 48" aria-hidden="true"><rect width="48" height="48" rx="14" fill="var(--primary)"/><path d="M19 0h10l9 42H10z" fill="var(--on-primary)" opacity=".13"/><ellipse cx="24" cy="40.5" rx="12" ry="2.6" fill="var(--on-primary)" opacity=".25"/><rect x="18.5" y="9" width="11" height="17" rx="5.5" fill="var(--on-primary)"/><rect x="21" y="14" width="6" height="1.8" rx=".9" fill="var(--primary)"/><rect x="21" y="17.6" width="6" height="1.8" rx=".9" fill="var(--primary)"/><path d="M15 21a9 9 0 0 0 18 0" fill="none" stroke="var(--on-primary)" stroke-width="2.4" stroke-linecap="round"/><rect x="22.8" y="30" width="2.4" height="9" rx="1.2" fill="var(--on-primary)"/></svg>`;

let state = null, aiv = null, conn = null, editing = false, phone = null, bootId = null, restarting = false;
// Collapsible sections: open state per section, remembered on this machine.
let secs = {};
try { secs = JSON.parse(localStorage.getItem("spot-console-sections") || "{}"); } catch {}
const isOpen = (id, dflt) => (id in secs ? secs[id] : dflt);
const sec = (id, title, summary, body, { open = true, cls = "", style = "" } = {}) =>
  `<details class="card sec ${cls}" data-sec="${id}" style="${style}" ${isOpen(id, open) ? "open" : ""}><summary><h2>${title}</h2>${summary ? `<span class="muted small sum">${summary}</span>` : ""}<span class="chev" aria-hidden="true"></span></summary><div class="secbody">${body}</div></details>`;
// Form state lives outside render(), so the 5 s refresh never wipes what was typed.
let joinCode = "", devName = null, joining = false, replaceOpen = false, altOpen = { code: false, key: false };
try { joinCode = new URLSearchParams(location.search).get("join") || ""; } catch {}
// AI models card: drafts, fetched models, test results, the open dropdown.
let draft = null, gKeyInput = "", pullName = "", ddOpen = null, replacingKey = false;
let gModels = null, gModelsBusy = false, testRes = {}, testBusy = {}, savingAi = false;
// Theme: system (default), light or dark, remembered on this machine.
let theme = "system";
try { theme = localStorage.getItem("spot-console-theme") || "system"; } catch {}

fetch("/api/phone").then((r) => (r.ok ? r.json() : null)).then((p) => { phone = p; if (state) render(); }).catch(() => {});

const shortV = (v) => (v && v.length > 12 ? v.slice(0, 7) : v);
const when = (ms) => (ms ? new Date(ms).toLocaleString([], { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) : "");
const left = (ms) => { const t = Math.max(0, Math.round((ms - Date.now()) / 1000)); return `${Math.floor(t / 60)}:${String(t % 60).padStart(2, "0")}`; };
const spin = `<span class="spin" aria-hidden="true"></span>`;
const validKeyShape = (k) => /^[A-Za-z0-9_-]{20,200}$/.test(k);
const holdRender = () => editing || ddOpen !== null;

/** A dropdown that matches the console instead of the browser's native select. */
const dd = (id, value, options, { placeholder = "Choose…", disabled = false } = {}) => {
  const open = ddOpen === id;
  const list = options.length ? options.map((o) => `<li role="option" tabindex="-1" aria-selected="${o === value}" data-dd-val="${esc(o)}" class="${o === value ? "sel" : ""}">${esc(o)}</li>`).join("") : `<li class="empty">Nothing to choose from yet</li>`;
  return `<div class="dd" data-dd="${id}"><button type="button" class="dd-btn" aria-haspopup="listbox" aria-expanded="${open}" ${disabled ? "disabled" : ""}><span class="mono ${value ? "" : "muted"}">${esc(value || placeholder)}</span><span class="chev" aria-hidden="true"></span></button>${open ? `<ul class="dd-list" role="listbox">${list}</ul>` : ""}</div>`;
};
const testChip = (key) => {
  if (testBusy[key]) return `<span class="chip neutral">${spin} Testing…</span>`;
  const r = testRes[key];
  if (!r) return "";
  return r.ok ? `<span class="chip ok" title="${esc(r.reply || "")}">✓ ${r.ms} ms</span>` : `<span class="chip bad" title="${esc(r.error)}">Failed</span>`;
};
const testErr = (key) => (testRes[key] && !testRes[key].ok ? `<div class="small err-text" style="margin-top:6px">${esc(testRes[key].error)}</div>` : "");

function updateBanner(s) {
  const u = s.update, p = u.progress;
  const what = p?.task === "local-on" ? "Setting up the local model" : p?.task === "local-off" ? "Turning off the local model" : "Updating Spot Solutions";
  if (restarting || u.running)
    return `<div class="banner busy" role="status">${spin}<div class="grow"><b>${restarting && !u.running ? "Restarting on the new version…" : `${what}…`}</b><div class="small">${esc(p?.step || "Working")}. This page reloads by itself when it's done; the worker restarts, WhatsApp reconnects within a minute.</div></div></div>`;
  if (p?.state === "error") return `<div class="banner bad" role="alert"><div class="grow"><b>${p.task === "update" || !p.task ? "The update didn't finish" : "That didn't finish"}</b><div class="small">${esc(p.error || "Something went wrong.")}</div></div>${p.task === "update" || !p.task ? `<button data-update-now>Try again</button>` : ""}</div>`;
  if (u.available) return `<div class="banner" role="status"><div class="grow"><b>Update available</b><div class="small"><span class="mono">${esc(shortV(u.current))}</span> → <span class="mono">${esc(shortV(u.latest.version))}</span>${u.latest.builtAt ? ` · released ${esc(when(u.latest.builtAt))}` : ""}. ${u.autoUpdate ? "It installs by itself shortly; you can do it now." : "Automatic updates are off."}</div></div><button data-update-now>Update now</button></div>`;
  return "";
}

function updatesCard(s) {

  return sec("updates", "Updates", u.available ? "Update available" : u.latest ? "Up to date" : "", `
      <div class="row2"><div class="grow"><b>Version</b><div class="muted small">${status}</div></div><span class="chip neutral mono">${esc(shortV(u.current))}</span></div>
      ${u.checkedAt ? `<div class="muted small" style="margin-top:6px">Last checked ${esc(when(u.checkedAt))}. Checks every 30 minutes.</div>` : ""}
      <div class="row2 split"><div class="grow"><b>Install updates automatically</b><div class="muted small">At a quiet moment, a few minutes after a release appears. The worker and this console restart; WhatsApp logins are kept.</div></div><button type="button" class="switch" role="switch" aria-checked="${u.autoUpdate}" aria-label="Install updates automatically" data-auto></button></div>
      <div class="actions"><button class="tonal" data-update-check ${u.running ? "disabled" : ""}>Check now</button>${u.available ? `<button data-update-now ${u.running ? "disabled" : ""}>Update now</button>` : ""}</div>`, { open: u.available, style: "margin-top:16px" });
}

function connectBlock(s) {
  const c = conn || { phase: "idle" };
  const name = esc(devName ?? s.hostname);
  if (c.phase === "waiting")
    return `<div class="panel"><div class="conn">
      <div class="grow"><b>Open this link and sign in</b>
        <ol class="steps small muted"><li>Open the link on this computer, or scan the code with your phone.</li><li>Sign in to Spot Solutions with Google. Only admins can connect a server.</li><li>Check that it shows <b class="mono check">${esc(c.verify)}</b>, then approve <b>${esc(c.deviceName)}</b>.</li></ol>
        <div class="linkbox mono">${esc(c.link)}</div>
        <div class="actions"><a class="btn" href="${esc(c.link)}" target="_blank" rel="noreferrer">Open sign-in page ↗</a><button class="tonal" data-copy-link>Copy link</button><button class="text" data-connect-cancel>Cancel</button></div>
        <div class="muted small" style="margin-top:10px">${spin} Waiting for approval · expires in <span id="cd" class="mono">${left(c.expiresAt)}</span></div></div>
      ${c.qr ? `<div class="qrbox" role="img" aria-label="QR code of the sign-in link">${c.qr}</div>` : ""}
    </div></div>`;
  if (c.phase === "installing") return `<div class="panel"><div class="muted">${spin} Approved${c.approvedBy ? ` by <b>${esc(c.approvedBy)}</b>` : ""}. Saving this server's key and starting the worker…</div></div>`;
  if (c.phase === "done") return `<div class="panel"><b>Connected</b><div class="muted small" style="margin-top:2px">Approved by ${esc(c.approvedBy || "an admin")}. The worker is starting; this server will show up under Server in the app within a minute.</div><div class="actions"><button class="text" data-connect-cancel>Connect again</button></div></div>`;
  const msg = c.phase === "error" ? c.error : c.phase === "expired" ? "That link expired. Make a new one." : "";
  return `<div class="panel">
      <b>Connect with your Spot Solutions account</b>
      <div class="muted small" style="margin-top:2px">Sign in with Google, on this computer or your phone, and approve this server. It gets its own key automatically, and you become one of its admins.</div>
      <label for="devname">Name for this server</label>
      <input type="text" id="devname" placeholder="${esc(s.hostname)}" value="${name}">
      ${msg ? `<div class="small err-text" style="margin-top:8px" role="alert">${esc(msg)}</div>` : ""}
      <div class="actions"><button data-connect-start>Connect with Spot Solutions</button></div>
    </div>`;
}

function setupInner(s) {
  const alt = `
    <details class="alt" id="alt-code" ${altOpen.code ? "open" : ""}><summary>Have a join code from the app?</summary>
      <form id="join" autocomplete="off">

        <label for="joincode">Join code</label>

    <details class="alt" id="alt-key" ${altOpen.key ? "open" : ""}><summary>First server ever? Use a key file</summary>
      <div class="muted small">Only for a brand-new Firebase project, before anyone is an admin in the app. In the <b>Firebase console, Project settings, Service accounts</b>, choose <b>Generate new private key</b> and drop the file here. Delete it afterwards: it is a password.</div>
      <div class="drop" id="drop" style="margin-top:12px"><b>Drop your service-account .json here</b><div class="muted small">or click to choose the file</div><input type="file" id="file" accept=".json,application/json" hidden></div>
    </details>`;

function aiCard(s) {
  const a = aiv;
  if (!a) return sec("ai", "AI models", "", `<div class="muted">Loading…</div>`, { open: false, style: "margin-top:16px" });
  if (!draft) draft = { mode: a.mode || "", localModel: a.localModel || "", geminiModel: a.geminiModel || "" };
  const hasKey = !!a.geminiKey;
  const local = a.localEnabled;
  const installed = a.ollama.models.map((m) => m.name);
  const defLocal = draft.localModel || (installed.includes("gemma3:4b") ? "gemma3:4b" : installed[0] || "gemma3:4b");
  const geminiOptions = gModels || (draft.geminiModel ? [draft.geminiModel] : []);
  const dirty = draft.mode !== (a.mode || "") || draft.localModel !== (a.localModel || "") || draft.geminiModel !== (a.geminiModel || "");
  const lowMem = s.memory.total < 7.5e9;
  const task = s.update.progress;
  const localBusy = s.update.running && (task?.task === "local-on" || task?.task === "local-off");
  const pull = a.pull;
  const pct = pull && pull.total ? Math.min(100, Math.round((pull.completed / pull.total) * 100)) : 0;
  const modeOpt = (m, desc, off) => `<label class="opt ${draft.mode === m ? "on" : ""} ${off ? "off" : ""}"><input type="radio" name="mode" value="${m}" ${draft.mode === m ? "checked" : ""} ${off ? "disabled" : ""}><span><b>${esc(a.modes[m])}</b><span class="muted small">${desc}</span></span></label>`;
  const summary = `${local ? "Local" : "Gemini only"}${hasKey ? " · Gemini key set" : ""}`;
  return sec("ai", "AI models", summary, `
    <div class="blk">
      <div class="row2"><div class="grow"><b>Local model on this computer</b><div class="muted small">${local ? (a.ollama.up ? `Ollama is running with ${a.ollama.models.length} model${a.ollama.models.length === 1 ? "" : "s"}. Chats stay on this machine.` : "On, but Ollama isn't answering. Restart it under Services.") : "Off. This server answers with Gemini only, and can't host accounts set to Local only."}</div></div>
        <button class="${local ? "tonal" : ""}" data-local="${local ? "off" : "on"}" ${localBusy ? "disabled" : ""}>${localBusy ? "Working…" : local ? "Turn off" : "Turn on"}</button></div>
      ${!local && lowMem ? `<div class="muted small" style="margin-top:6px">This computer has ${fmt(s.memory.total)} of memory. A local model wants about 8 GB; Gemini works fine without it.</div>` : ""}
      ${!local ? `<div class="muted small" style="margin-top:6px">Turning it on installs Ollama and downloads the model (about 3.5 GB). It runs in the background; this page shows progress.</div>` : ""}
    </div>

    <div class="blk"><b>Gemini key</b>
      <div class="muted small">Shared by every curator who hasn't added their own in the app (Settings, AI models). Stored on this server only.</div>
      ${hasKey && !replacingKey
        ? `<div class="row2" style="margin-top:10px"><span class="chip neutral mono">${esc(a.geminiKey)}</span><div class="grow"></div><button class="tonal sm" data-key-replace>Replace</button><button class="text sm" data-key-remove>Remove</button></div>`
        : `<form id="gkey" autocomplete="off" style="margin-top:10px"><input type="password" id="geminikey" autocomplete="off" spellcheck="false" placeholder="AIza…" value="${esc(gKeyInput)}"><div class="actions" style="margin-top:10px"><button type="submit">Save key</button>${replacingKey ? `<button type="button" class="text" data-key-cancel>Cancel</button>` : ""}</div></form>`}
    </div>

    <div class="blk"><b>Gemini model</b>
      <div class="muted small">Used when this server answers with Gemini.</div>
      <div class="fieldrow">${dd("gmodel", draft.geminiModel, geminiOptions, { placeholder: hasKey || validKeyShape(gKeyInput.trim()) ? "Fetch models, then choose" : "Add a key first", disabled: !hasKey && !validKeyShape(gKeyInput.trim()) })}
        <button class="tonal" data-fetch-models ${(!hasKey && !validKeyShape(gKeyInput.trim())) || gModelsBusy ? "disabled" : ""}>${gModelsBusy ? "Fetching…" : gModels ? "Refresh" : "Fetch models"}</button>
        <button class="tonal" data-test="gemini" data-model="${esc(draft.geminiModel)}" ${!draft.geminiModel || (!hasKey && !validKeyShape(gKeyInput.trim())) || testBusy["gemini:" + draft.geminiModel] ? "disabled" : ""}>Test</button>
        ${draft.geminiModel ? testChip("gemini:" + draft.geminiModel) : ""}</div>
      ${draft.geminiModel ? testErr("gemini:" + draft.geminiModel) : ""}
    </div>

    ${local ? `<div class="blk"><b>Local models</b>
      <div class="muted small">Installed in Ollama on this computer. The default is what the server uses for curators without their own choice.</div>
      ${installed.length ? `<div class="list">${a.ollama.models.map((m) => `<div class="row2 li"><div class="grow"><span class="mono">${esc(m.name)}</span> <span class="muted small">· ${fmt(m.size)}</span></div>${testChip("ollama:" + m.name)}<button class="tonal sm" data-test="ollama" data-model="${esc(m.name)}" ${testBusy["ollama:" + m.name] ? "disabled" : ""}>Test</button>${defLocal === m.name ? `<span class="chip ok">Default</span>` : `<button class="text sm" data-local-default="${esc(m.name)}">Make default</button>`}</div>${testErr("ollama:" + m.name)}`).join("")}</div>` : `<div class="muted small" style="margin-top:8px">${a.ollama.up ? "No models yet." : "Ollama isn't answering."}</div>`}
      <form id="pull" autocomplete="off" class="fieldrow" style="margin-top:12px"><input type="text" id="pullname" class="mono" placeholder="gemma3:4b" spellcheck="false" value="${esc(pullName)}"><button type="submit" class="tonal" ${pull && !pull.done ? "disabled" : ""}>Download</button></form>
      ${pull ? `<div style="margin-top:10px"><div class="stat"><span class="mono">${esc(pull.model)}</span><span class="muted">${pull.error ? "" : pull.done ? "Ready" : `${esc(pull.status)}${pull.total ? ` · ${pct}%` : ""}`}</span></div>${pull.error ? `<div class="small err-text" style="margin-top:6px">${esc(pull.error)}</div>` : `<div class="meter"><i style="width:${pull.done ? 100 : pct}%"></i></div>`}</div>` : ""}
    </div>` : ""}

    <div class="blk"><b>Default routing</b>
      <div class="muted small">Applies to curators who haven't chosen their own models. Anyone who has (Settings, AI models in the app) keeps their choice.</div>
      <div class="opts">
        ${modeOpt("local_first", "Local model answers; Gemini steps in if it fails.", !local)}
        ${modeOpt("gemini_first", "Gemini answers; the local model is the backup.", !local || !hasKey)}
        ${modeOpt("gemini_only", "Everything goes to Gemini.", !hasKey)}
        ${modeOpt("local_only", "Chats never leave this computer. Needs the local model.", !local)}
      </div>
      <div class="actions"><button data-save-ai ${!dirty || savingAi ? "disabled" : ""}>${savingAi ? "Saving…" : "Save defaults"}</button>${draft.mode === "" ? `<span class="muted small">Not set: curators keep the app's built-in default (local Gemma).</span>` : ""}${dirty ? `<button class="text" data-reset-ai>Discard</button>` : ""}</div>
    </div>`, { open: false, style: "margin-top:16px" });
}

// ---------- live dashboard (numbers come from /api/live: the worker's stats file, read every few seconds) ----------
let liveData = null, liveAt = 0, metric = "in";
try { metric = localStorage.getItem("spot-console-metric") || "in"; } catch {}
const METRICS = { in: ["Messages read", "read"], spot: ["Spot requests", "spot requests"], sent: ["Messages sent", "sent"], err: ["Errors", "errors"] };
const hourLabel = (h) => new Date(h).toLocaleTimeString([], { hour: "numeric" });
const n = (v) => Number(v || 0).toLocaleString();
const ago = (ms) => { const s = Math.max(0, Math.round((Date.now() - ms) / 1000)); return s < 60 ? "just now" : s < 3600 ? `${Math.floor(s / 60)}m ago` : s < 86400 ? `${Math.floor(s / 3600)}h ago` : when(ms); };
const dur = (ms) => { const s = Math.max(0, Math.round(ms / 1000)); return s < 60 ? `${s}s` : up(s); };
const pct = (a, b) => (b ? Math.round((a / b) * 100) : 0);
const STATUS = { ready: ["Ready", "ok", "ok"], qr: ["Scan QR", "neutral", "warn"], starting: ["Starting", "neutral", "warn"], authenticated: ["Starting", "neutral", "warn"], disconnected: ["Disconnected", "bad", "bad"], error: ["Error", "bad", "bad"], idle: ["Not linked", "neutral", "warn"] };

function liveChart(l) {
  const vals = l.series.map((b) => b[metric]);
  const peak = Math.max(0, ...vals), total = vals.reduce((a, b) => a + b, 0);
  const W = 240, H = 64, max = peak || 1;
  const [name, unit] = METRICS[metric];
  const bars = l.series.map((b, i) => {
    const v = b[metric], h = v ? Math.max(2, (v / max) * (H - 3)) : 0, x = i * 10 + 2;
    return `<g><title>${esc(`${hourLabel(b.h)}: ${v} ${unit}`)}</title><rect class="hit" x="${i * 10}" y="0" width="10" height="${H}"/>${v ? `<rect class="bar${i === 23 ? " now" : ""}" x="${x}" y="${(H - h).toFixed(1)}" width="6" height="${h.toFixed(1)}"/>` : `<rect class="zero" x="${x}" y="${H - 1}" width="6" height="1"/>`}</g>`;
  }).join("");
  const peakAt = peak ? l.series[vals.lastIndexOf(peak)].h : null;
  const ticks = [0, 6, 12, 18, 23].map((i) => `<span style="left:${(((i + .5) / 24) * 100).toFixed(2)}%">${i === 23 ? "now" : esc(hourLabel(l.series[i].h))}</span>`).join("");
  return `<div class="lv"><div class="lv-head"><b>${name}, last 24 hours</b><span class="muted small">${n(total)} total${peak ? ` · busiest hour ${esc(hourLabel(peakAt))} (${n(peak)})` : " · nothing yet"}</span></div>
    <div class="plot"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" class="m-${metric}" role="img" aria-label="${esc(`${name} per hour, last 24 hours: ${total} in total`)}"><line class="grid-l" x1="0" x2="${W}" y1="0.5" y2="0.5"/><line class="grid-l" x1="0" x2="${W}" y1="${H / 2}" y2="${H / 2}"/>${bars}</svg></div>
    <div class="axis" aria-hidden="true">${ticks}</div></div>`;
}

function lastUpdateText() {
  const p = state?.update?.progress;
  if (!p) return "None since install";
  if (p.state === "error") return `Failed: ${p.error || "see logs"}`;
  if (p.state === "running") return "Running now";
  return `${p.task === "local-on" || p.task === "local-off" ? "Local model changed" : p.to ? `Updated to ${shortV(p.to)}` : "Done"}`;
}

function liveBody() {
  const l = liveData;
  if (!l) return `<div class="muted empty">Waiting for the worker's first report. It writes its numbers every few seconds once it is running${state && !state.services.worker ? ", and it isn't running right now" : ""}.</div>`;
  const stale = l.state === "stale";
  const tile = (key, label, value, foot, o = {}) => {
    const inner = `<span class="tl">${label}</span><span class="tv ${o.bad ? "bad" : ""}">${value}</span><span class="tf">${foot}</span>`;
    return key ? `<button type="button" class="tile" data-metric="${key}" aria-pressed="${metric === key}" title="Chart ${esc(METRICS[key][0].toLowerCase())}">${inner}</button>` : `<div class="tile">${inner}</div>`;
  };
  const q = l.queue, a = l.ai, local = a.local, gem = a.gemini, aiSplit = local + gem;
  return `${stale ? `<div class="banner bad" style="margin-bottom:12px" role="status"><div class="grow"><b>The worker isn't reporting</b><div class="small">Last report ${esc(ago(Date.now() - l.ageMs))}. ${state && !state.services.worker ? "It's stopped: check Services below." : "The numbers below are the last ones it sent."}</div></div></div>` : ""}
    <div class="${stale ? "dimmed" : ""}">
    <div class="tiles">
      ${tile(null, "Connected", n(l.counts.ready), `of ${n(l.counts.accounts)} account${l.counts.accounts === 1 ? "" : "s"} here`)}
      ${tile("in", "Messages read", n(l.day.in), `${n(l.totals.in)} since start`)}
      ${tile("spot", "Spot requests", n(l.day.spot), `${n(l.totals.spot)} since start`)}
      ${tile("sent", "Sent", n(l.day.sent), `${n(l.totals.sent)} since start`)}
      ${tile("err", "Errors", n(l.day.err), `${n(l.totals.err)} since start`, { bad: l.day.err > 0 })}
      ${tile(null, "Send queue", n(q.pending), q.lastSendAt ? `last sent ${esc(ago(q.lastSendAt))}` : "nothing sent yet")}
    </div>
    <div class="muted small" style="margin-top:8px">Counts are for the last 24 hours. Tap Messages read, Spot requests, Sent or Errors to chart it.</div>
    ${liveChart(l)}
    <div class="lv-panels">
      <div class="panel"><b>AI</b>
        <div class="kv"><span>Classifications</span><b>${n(a.day)} <span class="muted small" style="font-weight:400">· ${n(a.total)} since start</span></b></div>
        <div class="kv" style="display:block"><div style="display:flex;justify-content:space-between;gap:12px"><span>Local vs Gemini</span><b>${aiSplit ? `${pct(local, aiSplit)}% / ${pct(gem, aiSplit)}%` : "none yet"}</b></div>${aiSplit ? `<div class="meter split" role="img" aria-label="${pct(local, aiSplit)} percent local, ${pct(gem, aiSplit)} percent Gemini"><i style="width:${pct(local, aiSplit)}%"></i><i style="width:${100 - pct(local, aiSplit)}%"></i></div>` : ""}</div>
        <div class="kv"><span>Average latency</span><b>${a.avgMs == null ? "no calls yet" : `${(a.avgMs / 1000).toFixed(a.avgMs < 10000 ? 1 : 0)} s`}</b></div>
        <div class="kv"><span>Failed attempts</span><b class="${a.fail ? "err-text" : ""}">${n(a.fail)}</b></div>
        <div class="kv"><span>Fell back to the other model</span><b>${n(a.fallback)}</b></div>
      </div>
      <div class="panel"><b>Worker</b>
        <div class="kv"><span>Running for</span><b>${l.uptimeMs == null ? "unknown" : esc(dur(l.uptimeMs))}</b></div>
        <div class="kv"><span>Version</span><b class="mono">${esc(shortV(l.version || state?.version || "dev"))}</b></div>
        <div class="kv"><span>Pending sends</span><b>${n(q.pending)}</b></div>
        <div class="kv"><span>Last message sent</span><b>${q.lastSendAt ? esc(ago(q.lastSendAt)) : "none yet"}</b></div>
        <div class="kv"><span>Last update</span><b>${esc(lastUpdateText())}</b></div>
      </div>
    </div></div>`;
}

function accountsBody() {
  const l = liveData;
  if (!l) return `<div class="muted empty">No report from the worker yet.</div>`;
  if (!l.accounts.length) return `<div class="muted empty">No accounts on this server right now. Curators show up here once they link WhatsApp in the app and this server takes them on.</div>`;
  return `<div class="acclist ${l.state === "stale" ? "dimmed" : ""}">${l.accounts.map((a) => {
    const st = STATUS[a.status] || [a.status, "neutral", "warn"];
    const title = a.name || a.email || "Account";
    const sub = [a.name && a.email ? a.email : null, a.phone, a.since ? `${st[0].toLowerCase()} since ${when(a.since)}` : null].filter(Boolean).map(esc).join(" · ");
    return `<div class="acc"><span class="dot ${st[2]}"></span><div class="who"><b>${esc(title)}${a.role === "agent" ? ` <span class="chip neutral" style="height:20px;padding:0 6px;font-size:11px">agent</span>` : ""}</b><div class="muted small">${sub}</div></div><span class="chip ${st[1]}">${esc(st[0])}</span><div class="nums small">${n(a.in)} read · ${n(a.spot)} spot · ${n(a.sent)} sent${a.err ? ` · <span class="err-text">${n(a.err)} err</span>` : ""}</div></div>`;
  }).join("")}</div><div class="muted small" style="margin-top:10px">Totals since the worker started. Phone numbers are masked and message text never leaves WhatsApp and the app.</div>`;
}

function liveSummaries() {
  const l = liveData;
  const dot = (c) => `<span class="dot ${c}" style="display:inline-block;width:8px;height:8px;margin-right:6px"></span>`;
  return {
    live: !l ? "Waiting for the worker" : l.state === "stale" ? `${dot("bad")}Worker not reporting` : `${dot("ok")}Live · ${n(l.day.in)} read · ${n(l.day.sent)} sent (24 h)`,
    accounts: !l ? "No report yet" : `${n(l.counts.ready)} of ${n(l.counts.accounts)} connected${l.counts.qr ? ` · ${l.counts.qr} need a scan` : ""}`,
  };
}
const livePrev = {};
const liveSecs = () => {
  const sm = liveSummaries(), live = liveBody(), acc = accountsBody();
  Object.assign(livePrev, { live, accounts: acc, lives: sm.live, accountss: sm.accounts }); // what the DOM now shows
  return `${sec("live", "Live", sm.live, live, { style: "margin-bottom:16px" })}${sec("accounts", `Accounts${liveData?.server?.hostname ? ` on ${esc(liveData.server.hostname)}` : " on this server"}`, sm.accounts, acc, { style: "margin-bottom:16px" })}`;
};
// Patch only what changed, so the 3 s refresh never replaces unchanged DOM (no flicker, no lost hover or scroll).
function patchLive() {
  const sm = liveSummaries();
  const bodies = { live: liveBody, accounts: accountsBody };
  for (const id of ["live", "accounts"]) {
    const d = document.querySelector(`details.sec[data-sec="${id}"]`);
    if (!d) continue;
    const sum = d.querySelector("summary .sum");
    if (sum && livePrev[id + "s"] !== sm[id]) { sum.innerHTML = sm[id]; livePrev[id + "s"] = sm[id]; }
    if (!d.open) continue;
    const html = bodies[id]();
    if (livePrev[id] === html && d.querySelector(".secbody").firstChild) continue;
    const body = d.querySelector(".secbody"), list = body.querySelector(".acclist"), top = list ? list.scrollTop : 0;
    body.innerHTML = html; livePrev[id] = html;
    const l2 = body.querySelector(".acclist"); if (l2) l2.scrollTop = top;
  }
}
async function pollLive() {
  clearTimeout(pollLive.t);
  let wait = 3000;
  if (document.hidden) return; // resumes on visibilitychange
  try {
    const r = await api("/api/live");
    liveData = r.live; liveAt = Date.now();
    if (state) patchLive();
  } catch { wait = 6000; }
  const open = ["live", "accounts"].some((id) => isOpen(id, true));
  pollLive.t = setTimeout(pollLive, open ? wait : 10000);
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) pollLive(); });
document.addEventListener("click", (e) => {
  const t = e.target.closest?.("[data-metric]");
  if (!t) return;
  metric = t.dataset.metric;
  try { localStorage.setItem("spot-console-metric", metric); } catch {}
  patchLive();
});

function render() {
  const s = state, c = s.config, k = c.key;
  const allUp = s.services.worker && (s.services.ollama || !s.localModel); // Gemini-only servers have no Ollama
  const steps = [
    { done: !!(k && k.projectId), title: "Connected to Spot Solutions", body: k && k.projectId ? `Project <b>${esc(k.projectId)}</b> · <span class="mono">${esc(k.clientEmail)}</span>` : "Sign in with your Spot Solutions account below, or use a join code. <a href=\"https://spot-solutions.web.app/help#several-servers\" target=\"_blank\" rel=\"noreferrer\">How ↗</a>" },
    { done: c.admins.length > 0, title: "Admins", body: c.admins.length ? c.admins.map(esc).join(", ") : "Emails that can see this server's page in the Spot Solutions app. Connecting with your account adds yours." },
    { done: !!c.geminiServerKey, optional: s.localModel, title: s.localModel ? "Server Gemini key (optional)" : "Gemini key (this server has no local model)", body: c.geminiServerKey ? `Set · <span class="mono">${esc(c.geminiServerKey)}</span>. Manage it under AI models.` : "Curators add their own key in the app (Settings → AI models), or set a shared one under AI models below." },
  ];
  const stepList = steps.map((st, i) => `<div class="step"><span class="num ${st.done ? "done" : ""}">${st.done ? "✓" : i + 1}</span><div class="grow"><b>${st.title}</b><div class="muted small" style="margin-top:2px">${st.body}</div></div></div>`).join("");
  // A server with no key leads with how to connect it; once connected, the checklist leads and reconnecting is tucked away.
  const setupBody = `
    ${k ? `${stepList}<details id="replace" style="margin-top:8px" ${replaceOpen ? "open" : ""}><summary style="cursor:pointer;font-weight:600">Reconnect or replace the key</summary><div style="margin-top:12px">${setupInner(s)}</div></details>` : `${setupInner(s)}<div style="margin-top:16px">${stepList}</div>`}
    <form id="cfg" style="margin-top:8px">
      <label for="admins">Admin emails (comma separated)</label>
      <input type="text" id="admins" value="${esc(c.admins.join(", "))}" placeholder="you@gmail.com">
      <div class="actions"><button type="submit">Save &amp; restart worker</button><a class="btn text" style="text-decoration:none;display:inline-flex" href="https://spot-solutions.web.app" target="_blank" rel="noreferrer">Open Spot Solutions ↗</a><a class="btn text" style="text-decoration:none;display:inline-flex" href="https://spot-solutions.web.app/help" target="_blank" rel="noreferrer">Server guide ↗</a></div>
    </form>`;
  $("#app").innerHTML = `
  <header>${logo}
    <div class="grow"><h1>${esc(s.hostname)}</h1><div class="muted small">${s.version ? `Spot Solutions <span class="mono">${esc(shortV(s.version))}</span> · ` : ""}${esc(s.distro || s.os)} · ${esc(s.arch)} · up ${up(s.uptime)} · ${s.ips.map((ip) => `<span class="mono">${ip}</span>`).join(", ") || "offline"}</div></div>
    <span class="chip ${allUp ? "ok" : "bad"}">${allUp ? "All services running" : "Needs attention"}</span>
    <div class="theme" role="group" aria-label="Theme">${["system", "light", "dark"].map((t) => `<button type="button" data-theme-set="${t}" aria-pressed="${theme === t}">${t[0].toUpperCase() + t.slice(1)}</button>`).join("")}</div>
  </header>
  ${(() => { const b = updateBanner(s); return b ? `<div style="margin-bottom:16px">${b}</div>` : ""; })()}

  ${liveSecs()}

  <div class="grid g2">
${sec("services", "Services", allUp ? "All running" : "Needs attention", `
      <div class="row"><span class="dot ${s.services.worker ? "ok" : "bad"}"></span><div class="grow"><b>Spot Solutions worker</b><div class="muted small">${s.services.worker ? "Running" : k ? "Stopped. Check the logs below." : "Waits for the Firebase key"}</div></div><button class="tonal sm" data-restart="worker">Restart</button></div>
      ${s.localModel ? `<div class="row"><span class="dot ${s.services.ollama ? "ok" : "bad"}"></span><div class="grow"><b>Ollama</b><div class="muted small">${s.ollama.up ? `${s.ollama.models.length} model${s.ollama.models.length === 1 ? "" : "s"} installed` : "Not responding"}</div></div><button class="tonal sm" data-restart="ollama">Restart</button></div>` : `<div class="row"><span class="dot ok"></span><div class="grow"><b>Local model</b><div class="muted small">Off: this server answers with Gemini only. Turn it on under AI models.</div></div></div>`}
      ${s.ollama.models.length ? `<div class="row"><div class="models">${s.ollama.models.map((m) => `<span class="chip neutral mono">${esc(m.name)} · ${fmt(m.size)}</span>`).join("")}</div></div>` : ""}
`, { cls: "tight" })}
${sec("machine", "Machine", `CPU ${Math.round(s.cpu.usage * 100)}% · memory ${Math.round((1 - s.memory.free / s.memory.total) * 100)}%`, `
      ${meter("CPU", s.cpu.usage, 1, `${Math.round(s.cpu.usage * 100)}% · ${s.cpu.cores} cores · load ${s.cpu.load[0].toFixed(2)}`)}
      ${meter("Memory", s.memory.total - s.memory.free, s.memory.total, `${fmt(s.memory.total - s.memory.free)} of ${fmt(s.memory.total)}`)}
      ${s.disk ? meter("Disk", s.disk.total - s.disk.free, s.disk.total, `${fmt(s.disk.free)} free of ${fmt(s.disk.total)}`) : ""}
      <div class="muted small mfoot">${esc(s.cpu.model)}</div>
`, { cls: "stack" })}
  </div>

${sec("setup", k ? "Setup" : "Connect this server", `${steps.filter((x) => x.done || x.optional).length} of ${steps.length} done`, setupBody, { open: !steps.every((x) => x.done || x.optional), style: "margin-top:16px" })}

${aiCard(s)}

${updatesCard(s)}

  ${phone && phone.qr ? sec("phone", "Open this console on your phone", "Scan with your phone's camera", `<div style="display:flex;gap:20px;flex-wrap:wrap;align-items:center"><pre class="qr" aria-label="QR code for this console">${esc(phone.qr)}</pre><div class="grow" style="min-width:220px"><div class="muted small">Scan while your phone is on the same Wi-Fi. The link includes this server's access code, so only share it with people who should manage the server.</div><div class="mono small" style="margin-top:8px;word-break:break-all">${esc(phone.url)}</div></div></div>`, { open: false, style: "margin-top:16px" }) : ""}

  ${sec("logs", "Worker logs", "updates every 5 s", `<pre class="logs" id="logs">${esc(s.logs)}</pre>`, { open: false, cls: "tight", style: "margin-top:16px" })}`;
  wire();
}

const post = (path, body) => api(path, body ?? {});
async function run(label, fn) {
  try { await fn(); } catch (e) { toast(e.message); }
  await refresh(true);
}

function wire() {
  const s = state;
  document.querySelectorAll("[data-theme-set]").forEach((b) => b.onclick = () => {
    theme = b.dataset.themeSet; applyTheme();
    try { localStorage.setItem("spot-console-theme", theme); } catch {}
    render();
  });
  document.querySelectorAll("details.sec").forEach((d) => d.ontoggle = () => {
    secs[d.dataset.sec] = d.open;
    try { localStorage.setItem("spot-console-sections", JSON.stringify(secs)); } catch {}
    if ((d.dataset.sec === "live" || d.dataset.sec === "accounts") && d.open) { livePrev[d.dataset.sec] = null; patchLive(); pollLive(); }
    if (d.dataset.sec === "logs" && d.open) { const l = $("#logs"); if (l) l.scrollTop = l.scrollHeight; }
  });
  const logs = $("#logs"); if (logs) logs.scrollTop = logs.scrollHeight;
  document.querySelectorAll("[data-restart]").forEach((b) => b.onclick = async () => {
    b.disabled = true; b.textContent = "Restarting…";
    try { const r = await api("/api/restart", { service: b.dataset.restart }); toast(r.active ? "Restarted" : "Restart sent, not active yet: check the logs"); } catch (e) { toast(e.message); }
    refresh();
  });

  // ---- connect ----
  const dn = $("#devname"); if (dn) dn.oninput = (e) => { devName = e.target.value; };
  const cs = $("[data-connect-start]"); if (cs) cs.onclick = async () => {
    cs.disabled = true;
    try { conn = await post("/api/connect/start", { deviceName: (devName ?? s.hostname).trim() }); render(); } catch (e) { toast(e.message); }
    refresh();
  };
  const cc = $("[data-connect-cancel]"); if (cc) cc.onclick = async () => { try { conn = await post("/api/connect/cancel"); } catch {} render(); };
  const cl = $("[data-copy-link]"); if (cl) cl.onclick = () => navigator.clipboard.writeText(conn.link).then(() => toast("Link copied"), () => toast("Couldn't copy. Select the link and copy it."));
  const drop = $("#drop"), file = $("#file");
  if (drop && file) {
    drop.onclick = () => file.click();
    drop.ondragover = (e) => { e.preventDefault(); drop.classList.add("over"); };
    drop.ondragleave = () => drop.classList.remove("over");
    drop.ondrop = (e) => { e.preventDefault(); drop.classList.remove("over"); upload(e.dataTransfer.files[0]); };
    file.onchange = () => upload(file.files[0]);
  }
  const rep = $("#replace"); if (rep) rep.ontoggle = () => { replaceOpen = rep.open; };
  const ac = $("#alt-code"); if (ac) ac.ontoggle = () => { altOpen.code = ac.open; };
  const ak = $("#alt-key"); if (ak) ak.ontoggle = () => { altOpen.key = ak.open; };
  if ($("#join")) {
    $("#joincode").oninput = (e) => { joinCode = e.target.value; };
    $("#join").onsubmit = async (e) => {
      e.preventDefault();
      if (!joinCode.trim()) return toast("Enter the join code from the app.");
      joining = true; render();
      try {
        const r = await api("/api/join", { code: joinCode, deviceName: (devName ?? s.hostname).trim() });
        joinCode = ""; replaceOpen = false;
        toast(`Joined ${r.projectId} as ${r.serviceAccount.split("@")[0]}. Worker starting…`);
      } catch (err) { toast(err.message); }
      joining = false; editing = false; refresh();
    };
  }
  ["admins", "geminikey", "joincode", "devname", "pullname"].forEach((id) => { const el = $("#" + id); if (el) { el.onfocus = () => editing = true; el.onblur = () => editing = false; } });
  $("#cfg").onsubmit = async (e) => {
    e.preventDefault();
    const body = { admins: $("#admins").value.split(",").map((x) => x.trim()).filter(Boolean) };
    try { await api("/api/config", body); toast("Saved. Worker restarting."); editing = false; } catch (err) { toast(err.message); }
    refresh();
  };

  // ---- updates ----
  document.querySelectorAll("[data-update-now]").forEach((b) => b.onclick = async () => {
    b.disabled = true;
    try { const r = await post("/api/update", { by: "console" }); if (r.upToDate) toast("Already up to date."); else restarting = true; } catch (e) { toast(e.message); }
    refresh(true);
  });
  const uc = $("[data-update-check]"); if (uc) uc.onclick = () => run("check", async () => { uc.disabled = true; uc.textContent = "Checking…"; await post("/api/update/check"); toast("Checked."); });
  const au = $("[data-auto]"); if (au) au.onclick = () => run("auto", () => post("/api/update/auto", { on: au.getAttribute("aria-checked") !== "true" }));

  // ---- AI models ----
  // Typing a key enables Fetch/Test without a re-render (which would drop the cursor).
  const gk = $("#geminikey"); if (gk) gk.oninput = (e) => {
    gKeyInput = e.target.value;
    const ok = validKeyShape(gKeyInput.trim()) || !!aiv?.geminiKey;
    const f = $("[data-fetch-models]"); if (f) f.disabled = !ok || gModelsBusy;
    const t = $('[data-test="gemini"]'); if (t) t.disabled = !ok || !draft.geminiModel;
    const b = document.querySelector('[data-dd="gmodel"] .dd-btn'); if (b) b.disabled = !ok;
  };
  const gf = $("#gkey"); if (gf) gf.onsubmit = async (e) => {
    e.preventDefault();
    if (!gKeyInput.trim()) return toast("Paste the Gemini key first.");
    try { await post("/api/ai/key", { key: gKeyInput.trim() }); gKeyInput = ""; replacingKey = false; editing = false; gModels = null; toast("Key saved. Worker restarting."); } catch (err) { toast(err.message); }
    refresh(true);
  };
  const kr = $("[data-key-replace]"); if (kr) kr.onclick = () => { replacingKey = true; render(); };
  const kc = $("[data-key-cancel]"); if (kc) kc.onclick = () => { replacingKey = false; gKeyInput = ""; editing = false; render(); };
  const kd = $("[data-key-remove]"); if (kd) kd.onclick = () => { if (confirm("Remove the server's Gemini key? Curators without their own key will have no Gemini fallback.")) run("key", async () => { await post("/api/ai/key", { key: "" }); gModels = null; toast("Key removed. Worker restarting."); }); };
  const fm = $("[data-fetch-models]"); if (fm) fm.onclick = async () => {
    gModelsBusy = true; render();
    try { gModels = (await post("/api/ai/models", { key: gKeyInput.trim() || undefined })).models; if (!draft.geminiModel && gModels.length) draft.geminiModel = gModels.find((m) => /flash/.test(m)) || gModels[0]; toast(`${gModels.length} models`); } catch (e) { toast(e.message); }
    gModelsBusy = false; render();
  };
  document.querySelectorAll("[data-test]").forEach((b) => b.onclick = async () => {
    const key = `${b.dataset.test}:${b.dataset.model}`;
    testBusy[key] = true; delete testRes[key]; render();
    try { const r = await post("/api/ai/test", { provider: b.dataset.test, model: b.dataset.model, key: b.dataset.test === "gemini" ? gKeyInput.trim() || undefined : undefined }); testRes[key] = { ok: true, ...r }; }
    catch (e) { testRes[key] = { ok: false, error: e.message }; }
    delete testBusy[key]; render();
  });
  document.querySelectorAll("[data-local-default]").forEach((b) => b.onclick = () => { draft.localModel = b.dataset.localDefault; render(); });
  document.querySelectorAll('input[name="mode"]').forEach((r) => r.onchange = () => { draft.mode = r.value; render(); });
  const sv = $("[data-save-ai]"); if (sv) sv.onclick = async () => {
    savingAi = true; render();
    try { await post("/api/ai/defaults", { mode: draft.mode, localModel: draft.localModel, geminiModel: draft.geminiModel }); toast("Saved. Worker restarting."); draft = null; } catch (e) { toast(e.message); }
    savingAi = false; refresh(true);
  };
  const ra = $("[data-reset-ai]"); if (ra) ra.onclick = () => { draft = null; render(); };
  const pf = $("#pull"); if (pf) {
    $("#pullname").oninput = (e) => { pullName = e.target.value; };
    pf.onsubmit = async (e) => {
      e.preventDefault();
      try { await post("/api/ai/pull", { model: pullName.trim() }); pullName = ""; editing = false; toast("Download started."); } catch (err) { toast(err.message); }
      refresh(true);
    };
  }
  document.querySelectorAll("[data-local]").forEach((b) => b.onclick = () => {
    const on = b.dataset.local === "on";
    if (!confirm(on ? "Turn on the local model? This installs Ollama and downloads the model (about 3.5 GB). The worker restarts when it's ready." : "Turn off the local model? The server will answer with Gemini only, and can't host accounts set to Local only. Downloaded models stay on disk.")) return;
    run("local", async () => { await post("/api/local", { enabled: on }); toast(on ? "Setting up the local model…" : "Turning it off…"); });
  });

  // ---- dropdowns ----
  document.querySelectorAll(".dd").forEach((d) => {
    const id = d.dataset.dd;
    const btn = d.querySelector(".dd-btn");
    btn.onclick = (e) => { e.stopPropagation(); ddOpen = ddOpen === id ? null : id; render(); };
    d.querySelectorAll("[data-dd-val]").forEach((li) => li.onclick = (e) => {
      e.stopPropagation();
      if (id === "gmodel") draft.geminiModel = li.dataset.ddVal;
      ddOpen = null; render();
    });
    if (ddOpen === id) (d.querySelector("li.sel") || d.querySelector("li"))?.scrollIntoView({ block: "nearest" });
  });
}
document.addEventListener("click", () => { if (ddOpen !== null) { ddOpen = null; if (state) render(); } });
document.addEventListener("keydown", (e) => {
  if (ddOpen === null) return;
  if (e.key === "Escape") { ddOpen = null; render(); return; }
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault();
    const items = [...document.querySelectorAll(".dd-list li[data-dd-val]")];
    const i = items.indexOf(document.activeElement);
    (items[i + (e.key === "ArrowDown" ? 1 : -1)] || items[0])?.focus();
  }
  if (e.key === "Enter" && document.activeElement?.dataset?.ddVal) document.activeElement.click();
});

async function upload(f) {
  if (!f) return;
  try {
    const key = JSON.parse(await f.text());
    const r = await api("/api/key", key);
    toast(`Key saved for ${r.projectId}. Worker starting…`);
  } catch (e) { toast(e.message.includes("JSON") ? "That file isn't valid JSON." : e.message); }
  refresh();
}

let refreshing = false;
async function refresh(force = false) {
  if (refreshing) return;
  refreshing = true;
  try {
    const [st, a, c] = await Promise.all([api("/api/status"), api("/api/ai").catch(() => aiv), api("/api/connect").catch(() => conn)]);
    state = st; aiv = a; conn = c;
    if (bootId === null) bootId = st.boot;
    else if (st.boot !== bootId) return location.reload(); // restarted on new code: load the new page
    if (restarting && !st.update.running) restarting = false;
    if (!holdRender() || force) { if (force) { editing = false; ddOpen = null; } render(); }
    else { const l = $("#logs"); if (l) l.textContent = state.logs; }
  } catch (e) {
    if (e.status === 401) $("#app").innerHTML = `<div class="locked">${logo}<h1 style="margin-top:16px">Locked</h1><p class="muted">Open this page with the link the installer printed (it ends in <span class="mono">?token=…</span>).<br>Forgot it? On the server run <span class="mono">sudo spot-console-url</span> (Linux), or open the <b>Spot Server Console</b> shortcut on the server's desktop (Windows), or use the Spot Server app (Mac).</p></div>`;
    else if (state?.update?.running || restarting) { restarting = true; render(); } // the console restarts itself during an update; keep trying
    else toast(e.message);
  }
  refreshing = false;
  // Faster while something is moving: a link waiting for approval, a model download, an update.
  clearTimeout(refresh.t);
  const busy = conn?.phase === "waiting" || conn?.phase === "installing" || aiv?.pull?.done === false || state?.update?.running || restarting;
  refresh.t = setTimeout(() => refresh(), busy ? 1500 : 5000);
}
setInterval(() => { const cd = $("#cd"); if (cd && conn?.expiresAt) cd.textContent = left(conn.expiresAt); }, 1000);
refresh();
pollLive();
</script>
</body>
</html>
