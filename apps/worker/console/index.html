<script>
// The Mac app shows this page in a WKWebView under its own native header (icon, state, Stop server), so the page leaves out what that header already
// has. Detected without needing a new app build: ?app=mac, the app's user agent token, or WKWebView's own user agent (a Mac browser that has no
// Safari/Chrome/Firefox/Edge token). ?app=0 forces the full page, for testing.
(function () {
  try {
    var ua = navigator.userAgent, q = new URLSearchParams(location.search).get("app");
    var mac = q === "mac" || /NothingBotServerApp/.test(ua) || (q !== "0" && /Macintosh/.test(ua) && /AppleWebKit/.test(ua) && !/(Safari|Chrome|CriOS|Firefox|FxiOS|Edg|OPR)\//.test(ua));
    if (mac) document.documentElement.setAttribute("data-app", "mac");
  } catch (e) {}
})();

  /* ---- server bar: the Mac app's header for every other browser (state, services, Stop/Start server) ---- */

  .pwr { margin: 0 0 16px; padding: 14px 20px; background: var(--s-low); border-radius: 20px; }

  .pwr .ph .tgl .sum { color: var(--on-surface-v); font-size: 13px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pwr .ph .tgl h2 { flex: none; }
  .pwr .chev.open { transform: none; }

  if (!a) return sec("ai", "AI models", "Loading…", `<div class="muted">Loading…</div>`, { open: false });
  if (!draft) draft = { mode: a.mode || "", localModel: a.localModel || "", geminiModel: a.geminiModel || "" };
  const hasKey = !!a.geminiKey;
  const local = a.localEnabled;
  const installed = a.ollama.models.map((m) => m.name);
  const defLocal = draft.localModel || (installed.includes("gemma3:4b") ? "gemma3:4b" : installed[0] || "gemma3:4b");
  const geminiOptions = gModels || (draft.geminiModel ? [draft.geminiModel] : []);
  const dirty = draft.mode !== (a.mode || "") || draft.localModel !== (a.localModel || "") || draft.geminiModel !== (a.geminiModel || "");
  const lowMem = s.memory.total < 7.5e9;
  const task = s.update.progress;
  const localBusy = s.update.running && (task?.task === "local-on" || task?.task === "local-off");
  const pull = a.pull;
  // Models flagged "Not installed": the server default (also an unsaved pick below), and models accounts here were routed to.
  const miss = [...(a.missing || [])];
  if (local && installed.length && draft.localModel && !installed.includes(draft.localModel) && !miss.some((m) => m.model === draft.localModel)) miss.push({ model: draft.localModel, kind: "default", to: null, kept: false });
  const missRows = miss.map((m) => `<div class="row2" style="margin-top:10px"><div class="grow"><span class="mono">${esc(m.model)}</span> <span class="chip bad">Not installed</span>
      <div class="muted small">${m.kind === "default" ? "The server default." : "An account on this server uses it."} ${m.kept ? `Kept on purpose; ${m.to ? `${esc(m.to)} answers` : "something else answers"} until you install it.` : m.to ? `${esc(m.to)} answers instead.` : "Nothing local answers it."}</div></div>
      <button class="tonal sm" data-install-model="${esc(m.model)}" ${pull && !pull.done ? "disabled" : ""}>Install</button><button class="text sm" data-pick-other>Pick another</button></div>`).join("");
  const swd = a.autoSwitched ? `<div class="row2" style="margin-top:10px"><div class="grow small">Switched from <b class="mono">${esc(a.autoSwitched.from)}</b> to <b class="mono">${esc(a.autoSwitched.to)}</b> because ${esc(a.autoSwitched.from)} isn't installed (${new Date(a.autoSwitched.at).toLocaleDateString([], { day: "numeric", month: "short", year: "numeric" })}).</div><button class="tonal sm" data-undo-switch>Undo</button></div>` : "";
  const pct = pull && pull.total ? Math.min(100, Math.round((pull.completed / pull.total) * 100)) : 0;
  const modeOpt = (m, desc, off) => `<label class="opt ${draft.mode === m ? "on" : ""} ${off ? "off" : ""}"><input type="radio" name="mode" value="${m}" ${draft.mode === m ? "checked" : ""} ${off ? "disabled" : ""}><span><b>${esc(a.modes[m])}</b><span class="muted small">${desc}</span></span></label>`;
  const summary = `${a.mode ? esc(a.modes[a.mode]) : "Built-in default"} · ${local ? "local model on" : "Gemini only"}${hasKey ? " · Gemini key set" : ""}`;
  return sec("ai", "AI models", summary, `
    <div class="blk"><h3 class="grp">Gemini (cloud)</h3>
    <b class="lbl">API key</b>
      <div class="muted small">Shared by every curator who hasn't added their own in the app (Settings, AI models). Stored on this server only.</div>
      ${hasKey && !replacingKey
        ? `<div class="row2" style="margin-top:10px"><span class="chip neutral mono">${esc(a.geminiKey)}</span><div class="grow"></div><button class="tonal sm" data-key-replace>Replace</button><button class="text sm" data-key-remove>Remove</button></div>`
        : `<form id="gkey" autocomplete="off" style="margin-top:10px"><input type="password" id="geminikey" autocomplete="off" spellcheck="false" placeholder="AIza…" value="${esc(gKeyInput)}"><div class="actions" style="margin-top:10px"><button type="submit">Save key</button>${replacingKey ? `<button type="button" class="text" data-key-cancel>Cancel</button>` : ""}</div></form>`}
    
      <div class="sub">
    <b class="lbl">Model</b>
        <div class="muted small">Used when this server answers with Gemini.</div>
        <div class="fieldrow">${dd("gmodel", draft.geminiModel, geminiOptions, { placeholder: hasKey || validKeyShape(gKeyInput.trim()) ? "Fetch models, then choose" : "Add a key first", disabled: !hasKey && !validKeyShape(gKeyInput.trim()) })}
          <button class="tonal" data-fetch-models ${(!hasKey && !validKeyShape(gKeyInput.trim())) || gModelsBusy ? "disabled" : ""}>${gModelsBusy ? "Fetching…" : gModels ? "Refresh" : "Fetch models"}</button>
          <button class="tonal" data-test="gemini" data-model="${esc(draft.geminiModel)}" ${!draft.geminiModel || (!hasKey && !validKeyShape(gKeyInput.trim())) || testBusy["gemini:" + draft.geminiModel] ? "disabled" : ""}>Test</button>
          ${draft.geminiModel ? testChip("gemini:" + draft.geminiModel) : ""}</div>
        ${draft.geminiModel ? testErr("gemini:" + draft.geminiModel) : ""}
      
      </div>
    </div>

    <div class="blk"><h3 class="grp">Local model (Ollama)</h3>
      <div class="row2"><div class="grow"><b>Local model on this computer</b><div class="muted small">${local ? (a.ollama.up ? `Ollama is running with ${a.ollama.models.length} model${a.ollama.models.length === 1 ? "" : "s"}. Chats stay on this machine.` : (state?.workerControl?.model?.stopped ? "On, but Ollama is stopped. Start it under Services." : "On, but Ollama isn't answering. Restart it under Services.")) : "Off. This server answers with Gemini only, and can't host accounts set to Local only."}</div></div>
        <button class="${local ? "tonal" : ""}" data-local="${local ? "off" : "on"}" ${localBusy ? "disabled" : ""}>${localBusy ? "Working…" : local ? "Turn off" : "Turn on"}</button></div>
      ${!local && lowMem ? `<div class="muted small" style="margin-top:6px">This computer has ${fmt(s.memory.total)} of memory. A local model wants about 8 GB; Gemini works fine without it.</div>` : ""}
      ${!local ? `<div class="muted small" style="margin-top:6px">Turning it on installs Ollama and downloads the model (about 3.5 GB). It runs in the background; this page shows progress.</div>` : ""}
    
    ${local && (swd || missRows) ? `<div class="sub" id="ai-missing">${swd}${missRows}</div>` : ""}
    ${local ? `<div class="sub" id="ai-installed"><b class="lbl">Installed models</b>
      <div class="muted small">Installed in Ollama on this computer. The default is what the server uses for curators without their own choice.</div>
      ${a.ollama.modelsDir ? `<div class="muted small mono" style="margin-top:8px" title="Found via ${esc(a.ollama.modelsSource)}">${modelsWhere(a.ollama)}</div>` : ""}
      ${installed.length ? modelsList(a, s) : `<div class="muted small" style="margin-top:8px">${a.ollama.up ? (a.ollama.problem ? wrongFolderNote(a.ollama) : "No models yet.") : "Ollama isn't answering."}</div>`}
      <form id="pull" autocomplete="off" class="fieldrow" style="margin-top:12px"><input type="text" id="pullname" class="mono" placeholder="gemma3:4b" spellcheck="false" value="${esc(pullName)}"><button type="submit" class="tonal" ${pull && !pull.done ? "disabled" : ""}>Download</button></form>
      ${pull ? `<div style="margin-top:10px"><div class="stat"><span class="mono">${esc(pull.model)}</span><span class="muted">${pull.error ? "" : pull.done ? "Ready" : `${esc(pull.status)}${pull.total ? ` · ${pct}%` : ""}`}</span></div>${pull.error ? `<div class="small err-text" style="margin-top:6px">${esc(pull.error)}</div>` : `<div class="meter"><i style="width:${pull.done ? 100 : pct}%"></i></div>`}</div>` : ""}
    </div>` : ""}
    </div>

    <div class="blk"><h3 class="grp">Ollama Cloud (e.g. beam:cloud)</h3>
      <div class="row2" style="gap:10px; flex-wrap:wrap;">
        <div class="grow" style="min-width:220px"><input id="cloudurl" class="mono" type="text" value="https://ollama.com" placeholder="https://ollama.com"></div>
        <div class="grow" style="min-width:220px"><input id="cloudkey" class="mono" type="password" placeholder="Ollama API key" ${(s && s.ollamaCloudEnabled) ? 'value="••••saved"' : ""}></div>
        <button class="tonal" onclick="(async()=>{const u=document.getElementById(&quot;cloudurl&quot;).value,k=(document.getElementById(&quot;cloudkey&quot;).value||'').trim();if(k==='••••saved'){alert('Enter a new key (or clear) first');return;}try{const r=await fetch('/api/admin/env?token='+encodeURIComponent((location.search.match(/[?&]token=([^&]+)/)||[])[1]||''),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({OLLAMA_URL:u,OLLAMA_API_KEY:k})});const t=await r.json();if(!r.ok)throw new Error(t.error||r.status);document.getElementById('cloudmodels').textContent=t.cloudEnabled ? 'Cloud configured — fetch to list models.' : 'Cloud not configured; add a key first.';try{const rr=await fetch('/api/restart?token='+encodeURIComponent((location.search.match(/[?&]token=([^&]+)/)||[])[1]||''),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({service:'worker'})});}catch(e){}alert('Saved. Restarted automatically. Cloud is '+(t.cloudEnabled?'on':'off')+'.');}catch(e){alert('Couldn’t save: '+e.message);}})()">Save / use Ollama Cloud</button>
      </div>
      <div class="row2" style="gap:10px; margin-top:8px; flex-wrap:wrap;">
        <button type="button" class="tonal sm" onclick="(async()=>{try{const r=await fetch('/api/admin/models?token='+encodeURIComponent((location.search.match(/[?&]token=([^&]+)/)||[])[1]||''));const t=await r.json();document.getElementById('cloudmodels').textContent=t.models&&t.models.length?t.models.map((m)=>m.name).join(', '):('No cloud models reported ('+(t.error||'unknown')+')');if(t.cloudEnabled)document.getElementById('cloudmodels').textContent += ' (cloud enabled)';}catch(e){document.getElementById('cloudmodels').textContent='Couldn’t load cloud models: '+e.message;}})()">Fetch models</button>
        <div class="grow muted small" id="cloudmodels">${s && s.ollamaCloudEnabled ? "Cloud configured — fetch to list models." : "Cloud not configured; add a key first."}</div>
      </div>
    </div>

    <div class="blk"><h3 class="grp">Which one answers</h3>
      <div class="muted small">Applies to curators who haven't chosen their own models. Anyone who has (Settings, AI models in the app) keeps their choice.</div>
      <div class="opts">
        ${modeOpt("local_first", "Local model answers; Gemini steps in if it fails.", !local)}
        ${modeOpt("gemini_first", "Gemini answers; the local model is the backup.", !local || !hasKey)}
        ${modeOpt("gemini_only", "Everything goes to Gemini.", !hasKey)}
        ${modeOpt("local_only", "Chats never leave this computer. Needs the local model.", !local)}
      </div>
      <div class="actions"><button data-save-ai ${!dirty || savingAi ? "disabled" : ""}>${savingAi ? "Saving…" : "Save defaults"}</button>${draft.mode === "" ? `<span class="muted small">Not set: curators keep the app's built-in default (local Gemma).</span>` : ""}${dirty ? `<button class="text" data-reset-ai>Discard</button>` : ""}</div>
    </div>`, { open: false });
}

// ---------- live dashboard (numbers come from /api/live: the worker's stats file, read every few seconds) ----------
let liveData = null, liveAt = 0, metric = "in";
try { metric = localStorage.getItem("nbs-console-metric") || "in"; } catch {}
const METRICS = { in: ["Messages read", "read"], spot: ["Spot requests", "spot requests"], sent: ["Messages sent", "sent"], err: ["Errors", "errors"] };
const hourLabel = (h) => new Date(h).toLocaleTimeString([], { hour: "numeric" });
const n = (v) => Number(v || 0).toLocaleString();
const ago = (ms) => { const s = Math.max(0, Math.round((Date.now() - ms) / 1000)); return s < 60 ? "just now" : s < 3600 ? `${Math.floor(s / 60)}m ago` : s < 86400 ? `${Math.floor(s / 3600)}h ago` : when(ms); };
const dur = (ms) => { const s = Math.max(0, Math.round(ms / 1000)); return s < 60 ? `${s}s` : up(s); };
const pct = (a, b) => (b ? Math.round((a / b) * 100) : 0);
const STATUS = { ready: ["Ready", "ok", "ok"], qr: ["Scan QR", "neutral", "warn"], starting: ["Starting", "neutral", "warn"], authenticated: ["Starting", "neutral", "warn"], disconnected: ["Disconnected", "bad", "bad"], error: ["Error", "bad", "bad"], idle: ["Not linked", "neutral", "warn"] };

function liveChart(l) {
  const vals = l.series.map((b) => b[metric]);
  const peak = Math.max(0, ...vals), total = vals.reduce((a, b) => a + b, 0);
  const W = 240, H = 64, max = peak || 1;
  const [name, unit] = METRICS[metric];
  const bars = l.series.map((b, i) => {
    const v = b[metric], h = v ? Math.max(2, (v / max) * (H - 3)) : 0, x = i * 10 + 2;
    return `<g><title>${esc(`${hourLabel(b.h)}: ${v} ${unit}`)}</title><rect class="hit" x="${i * 10}" y="0" width="10" height="${H}"/>${v ? `<rect class="bar${i === 23 ? " now" : ""}" x="${x}" y="${(H - h).toFixed(1)}" width="6" height="${h.toFixed(1)}"/>` : `<rect class="zero" x="${x}" y="${H - 1}" width="6" height="1"/>`}</g>`;
  }).join("");
  const peakAt = peak ? l.series[vals.lastIndexOf(peak)].h : null;
  const ticks = [0, 6, 12, 18, 23].map((i) => `<span style="left:${(((i + .5) / 24) * 100).toFixed(2)}%">${i === 23 ? "now" : esc(hourLabel(l.series[i].h))}</span>`).join("");
  return `<div class="lv"><div class="lv-head"><b>${name}, last 24 hours</b><span class="muted small">${n(total)} total${peak ? ` · busiest hour ${esc(hourLabel(peakAt))} (${n(peak)})` : " · nothing yet"}</span></div>
    <div class="plot"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" class="m-${metric}" role="img" aria-label="${esc(`${name} per hour, last 24 hours: ${total} in total`)}"><line class="grid-l" x1="0" x2="${W}" y1="0.5" y2="0.5"/><line class="grid-l" x1="0" x2="${W}" y1="${H / 2}" y2="${H / 2}"/>${bars}</svg></div>
    <div class="axis" aria-hidden="true">${ticks}</div></div>`;
}

function lastUpdateText() {
  const p = state?.update?.progress;
  if (!p) return "None since install";
  if (p.state === "error") return `Failed: ${p.error || "see logs"}`;
  if (p.state === "running") return "Running now";
  return `${p.task === "local-on" || p.task === "local-off" ? "Local model changed" : p.to ? `Updated to ${shortV(p.to)}` : "Done"}`;
}

const tileOf = (key, label, value, foot, o = {}) => {
  const inner = `<span class="tl">${label}</span><span class="tv ${o.bad ? "bad" : ""}">${value}</span><span class="tf">${foot}</span>`;
  return key ? `<button type="button" class="tile" data-metric="${key}" aria-pressed="${metric === key}" title="Chart ${esc(METRICS[key][0].toLowerCase())}">${inner}</button>` : `<div class="tile">${inner}</div>`;
};
// The stats bar: the tiles. Kept apart from the chart and panels below it, so each can be collapsed on its own.
function liveStatsBody() {
  const l = liveData;
  if (!l) return `<div class="muted empty">Waiting for the worker's first report. It writes its numbers every few seconds once it is running${state && !state.services.worker ? ", and it isn't running right now" : ""}.</div>`;
  const stale = l.state === "stale", q = l.queue;
  return `${stale && !state?.workerControl?.stopped ? `<div class="banner bad" style="margin-bottom:12px" role="status"><div class="grow"><b>The worker isn't reporting</b><div class="small">Last report ${esc(ago(Date.now() - l.ageMs))}. ${state && !state.services.worker ? "It's stopped: check Server below." : "The numbers below are the last ones it sent."}</div></div></div>` : ""}
    <div class="${stale ? "dimmed" : ""}"><div class="tiles">
      ${tileOf(null, "Connected", n(clientsOf(l).filter((a) => a.status === "ready").length), `of ${n(clientsOf(l).length)} account${clientsOf(l).length === 1 ? "" : "s"} here${agentsReady(l) ? ` · ${n(agentsReady(l))} agent${agentsReady(l) === 1 ? "" : "s"}` : ""}`)}
      ${tileOf("in", "Messages read", n(l.day.in), `${n(l.totals.in)} since start`)}
      ${tileOf("spot", "Spot requests", n(l.day.spot), `${n(l.totals.spot)} since start`)}
      ${tileOf("sent", "Sent", n(l.day.sent), `${n(l.totals.sent)} since start`)}
      ${tileOf("err", "Errors", n(l.day.err), `${n(l.totals.err)} since start`, { bad: l.day.err > 0 })}
      ${tileOf(null, "Send queue", n(q.pending), q.lastSendAt ? `last sent ${esc(ago(q.lastSendAt))}` : "nothing sent yet")}
    </div>
    <div class="muted small" style="margin-top:8px">Counts are for the last 24 hours. Tap Messages read, Spot requests, Sent or Errors to chart it.</div></div>`;
}
// The detail: the hourly chart, then the AI and worker panels.
function liveDetailBody() {
  const l = liveData;
  if (!l) return `<div class="muted empty">The chart and AI numbers appear once the worker reports.</div>`;
  const stale = l.state === "stale", q = l.queue, a = l.ai, local = a.local, gem = a.gemini, aiSplit = local + gem;
  return `<div class="${stale ? "dimmed" : ""}">
    ${liveChart(l)}
    <div class="lv-panels">
      <div class="panel"><b>AI</b>
        <div class="kv"><span>Classifications</span><b>${n(a.day)} <span class="muted small" style="font-weight:400">· ${n(a.total)} since start</span></b></div>
        <div class="kv" style="display:block"><div style="display:flex;justify-content:space-between;gap:12px"><span>Local vs Gemini</span><b>${aiSplit ? `${pct(local, aiSplit)}% / ${pct(gem, aiSplit)}%` : "none yet"}</b></div>${aiSplit ? `<div class="meter split" role="img" aria-label="${pct(local, aiSplit)} percent local, ${pct(gem, aiSplit)} percent Gemini"><i style="width:${pct(local, aiSplit)}%"></i><i style="width:${100 - pct(local, aiSplit)}%"></i></div>` : ""}</div>
        <div class="kv"><span>Average latency</span><b>${a.avgMs == null ? "no calls yet" : `${(a.avgMs / 1000).toFixed(a.avgMs < 10000 ? 1 : 0)} s`}</b></div>
        <div class="kv"><span>Failed attempts</span><b class="${a.fail ? "err-text" : ""}">${n(a.fail)}</b></div>
        <div class="kv"><span>Fell back to the other model</span><b>${n(a.fallback)}</b></div>
      </div>
      <div class="panel"><b>Worker</b>
        <div class="kv"><span>Running for</span><b>${l.uptimeMs == null ? "unknown" : esc(dur(l.uptimeMs))}</b></div>
        <div class="kv"><span>Version</span><b class="mono">${esc(shortV(l.version || state?.version || "dev"))}</b></div>
        <div class="kv"><span>Pending sends</span><b>${n(q.pending)}</b></div>
        <div class="kv"><span>Last message sent</span><b>${q.lastSendAt ? esc(ago(q.lastSendAt)) : "none yet"}</b></div>
        <div class="kv"><span>Last update</span><b>${esc(lastUpdateText())}</b></div>
      </div>
    </div></div>`;
}

// Accounts here, each with its agent number (if linked) underneath. Counts are per account; the agent is a detail of it.
const clientsOf = (l) => l.accounts.filter((a) => a.role !== "agent");
const agentOf = (l, uid) => l.accounts.find((a) => a.role === "agent" && a.uid === uid);
const agentsReady = (l) => l.accounts.filter((a) => a.role === "agent" && a.status === "ready").length;
function accStatus(a) {
  let st = STATUS[a.status] || [a.status, "neutral", "warn"];
  if (a.status === "ready" && a.health && a.health !== "ok") st = [a.health === "failing" ? "Not responding" : "Restarting", "bad", "bad"];
  return st;
}
function accountsBody() {
  const l = liveData;
  if (!l) return `<div class="muted empty">No report from the worker yet.</div>`;
  if (!l.accounts.length) return `<div class="muted empty">No accounts on this server right now. Curators show up here once they link WhatsApp in the app and this server takes them on.</div>`;
  // An agent whose main account isn't on this server still shows, as its own row.
  const rows = [...clientsOf(l), ...l.accounts.filter((a) => a.role === "agent" && !l.accounts.some((c) => c.role !== "agent" && c.uid === a.uid))];
  return `<div class="acclist ${l.state === "stale" ? "dimmed" : ""}">${rows.map((a) => {
    const st = accStatus(a);
    const title = a.name || a.email || "Account";
    const sub = [a.name && a.email ? a.email : null, a.phone, a.since ? `${st[0].toLowerCase()} since ${when(a.since)}` : null, a.healthNote].filter(Boolean).map(esc).join(" · ");
    const ag = a.role === "agent" ? null : agentOf(l, a.uid);
    const agRow = ag ? (() => {
      const at = accStatus(ag);
      const asub = [ag.phone, ag.since ? `${at[0].toLowerCase()} since ${when(ag.since)}` : null, ag.healthNote].filter(Boolean).map(esc).join(" · ");
      return `<div class="acc agent"><span class="dot ${at[2]}"></span><div class="who"><b>Agent number</b><div class="muted small">${asub || "Talks to you on WhatsApp for this account"}</div></div><span class="chip ${at[1]}">${esc(at[0])}</span><div class="nums small">${n(ag.sent)} sent${ag.err ? ` · <span class="err-text">${n(ag.err)} err</span>` : ""}</div></div>`;
    })() : "";
    const agChip = a.role === "agent" ? ` <span class="chip neutral" style="height:20px;padding:0 6px;font-size:11px">agent</span>` : "";
    return `<div class="accgroup"><div class="acc"><span class="dot ${st[2]}"></span><div class="who"><b>${esc(title)}${agChip}</b><div class="muted small">${sub}</div></div><span class="chip ${st[1]}">${esc(st[0])}</span><div class="nums small">${n(a.in)} read · ${n(a.spot)} spot · ${n(a.sent)} sent${a.err ? ` · <span class="err-text">${n(a.err)} err</span>` : ""}</div></div>${agRow}</div>`;
  }).join("")}</div><div class="muted small" style="margin-top:10px">Totals since the worker started. Phone numbers are masked and message text never leaves WhatsApp and the app.</div>`;
}

function liveSummaries() {
  const l = liveData;
  const dot = (c) => `<span class="dot ${c}" style="display:inline-block;width:8px;height:8px;margin-right:6px"></span>`;
  const avg = l?.ai?.avgMs == null ? "" : ` · avg ${(l.ai.avgMs / 1000).toFixed(l.ai.avgMs < 10000 ? 1 : 0)} s`;
  return {
    stats: !l ? "Waiting for the worker" : l.state === "stale" ? `${dot("bad")}Worker not reporting` : `${dot("ok")}${n(clientsOf(l).filter((a) => a.status === "ready").length)} connected${agentsReady(l) ? ` · ${n(agentsReady(l))} agent${agentsReady(l) === 1 ? "" : "s"}` : ""} · ${n(l.day.in)} read · ${n(l.day.sent)} sent in 24 h`,
    detail: !l ? "No report yet" : `${METRICS[metric][0]} ${n(l.day[metric])} in 24 h · AI ${n(l.ai.day)} call${l.ai.day === 1 ? "" : "s"}${avg}`,
    accounts: !l ? "No report yet" : `${n(clientsOf(l).filter((a) => a.status === "ready").length)} of ${n(clientsOf(l).length)} connected${agentsReady(l) ? ` · ${n(agentsReady(l))} agent${agentsReady(l) === 1 ? "" : "s"} linked` : ""}${l.counts.qr ? ` · ${l.counts.qr} need a scan` : ""}`,
  };
}
const liveBodies = { stats: liveStatsBody, detail: liveDetailBody, accounts: accountsBody };
const livePrev = {};
// The three live sections' HTML, with what the DOM now shows remembered so the 3 s refresh can patch only what changed.
const liveBlock = (id, title) => {
  const sm = liveSummaries()[id], body = liveBodies[id]();
  livePrev[id] = body; livePrev[id + "s"] = sm;
  return sec(id, title, sm, body);
};
// Patch only what changed, so the 3 s refresh never replaces unchanged DOM (no flicker, no lost hover or scroll).
function patchLive() {
  const sm = liveSummaries();
  for (const id of Object.keys(liveBodies)) {
    const d = document.querySelector(`details.sec[data-sec="${id}"]`);
    if (!d) continue;
    const sum = d.querySelector("summary .sum");
    if (sum && livePrev[id + "s"] !== sm[id]) { sum.innerHTML = sm[id]; livePrev[id + "s"] = sm[id]; }
    if (!d.open) continue;
    const html = liveBodies[id]();
    if (livePrev[id] === html && d.querySelector(".secbody").firstChild) continue;
    const body = d.querySelector(".secbody"), list = body.querySelector(".acclist"), top = list ? list.scrollTop : 0;
    body.innerHTML = html; livePrev[id] = html;
    const l2 = body.querySelector(".acclist"); if (l2) l2.scrollTop = top;
  }
}
async function pollLive() {
  clearTimeout(pollLive.t);
  let wait = 3000;
  if (document.hidden) return; // resumes on visibilitychange
  try {
    const r = await api("/api/live");
    liveData = r.live; liveAt = Date.now();
    if (state) patchLive();
  } catch { wait = 6000; }
  const open = Object.keys(liveBodies).some((id) => isOpen(id, true) && shown(id));
  pollLive.t = setTimeout(pollLive, open ? wait : 10000);
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) pollLive(); });
document.addEventListener("click", (e) => {
  const t = e.target.closest?.("[data-metric]");
  if (!t) return;
  metric = t.dataset.metric;
  try { localStorage.setItem("nbs-console-metric", metric); } catch {}
  patchLive();
});

function logSummary(text) {
  const lines = (text || "").split(/\r?\n/).filter(Boolean);
  if (!lines.length) return "No logs yet";
  for (let i = lines.length - 1; i >= 0; i--) {
    const m = /^(\d{4}-\d\d-\d\d[T ]\d\d:\d\d:\d\d)/.exec(lines[i]);
    const t = m ? Date.parse(m[1].replace(" ", "T")) : NaN;
    if (!isNaN(t)) return `last entry ${ago(t)} · ${lines.length} lines`;
  }
  return `${lines.length} lines · updates every 5 s`;
}

  else if (e.key === "ArrowRight" && i >= 0) { e.preventDefault(); rows[i].click(); }
  else if (e.key === "Backspace" || e.key === "ArrowLeft" || (e.key === "ArrowUp" && e.altKey)) {
    if (e.target.matches?.("input,textarea")) return;
    e.preventDefault();
    if (pk.view === "dir") { if (pk.dir.parent) pkGo(pk.dir.parent); else pkRoots(); }
  }
}

async function upload(f) {
  if (!f) return;
  try {
    const key = JSON.parse(await f.text());
    const r = await api("/api/key", key);
    toast(`Key saved for ${r.projectId}. Worker starting…`);
  } catch (e) { toast(e.message.includes("JSON") ? "That file isn't valid JSON." : e.message); }
  refresh();
}

let refreshing = false;
async function refresh(force = false) {
  if (refreshing) return;
  refreshing = true;
  try {
    // The data folder is only counted (it can hold thousands of files) while the Storage section is open or a move is running.
    const wantScan = isOpen("storage", Boolean(state?.storage?.low)) && shown("storage") || moveRunning();
    const [st, a, c, sg] = await Promise.all([api("/api/status"), api("/api/ai").catch(() => aiv), api("/api/connect").catch(() => conn), api(`/api/storage${wantScan ? "?scan=1" : ""}`).catch(() => stor)]);
    state = st; aiv = a; conn = c; stor = sg;
    if (bootId === null) bootId = st.boot;
    else if (st.boot !== bootId) return location.reload(); // restarted on new code: load the new page
    if (restarting && !st.update.running) restarting = false;
    if (!holdRender() || force) { if (force) { editing = false; ddOpen = null; } render(); }
    else { const l = $("#logs"); if (l) l.textContent = state.logs; }
  } catch (e) {
    if (e.status === 401) $("#app").innerHTML = `<div class="locked">${logo}<h1 style="margin-top:16px">Locked</h1><p class="muted">Open this page with the link the installer printed (it ends in <span class="mono">?token=…</span>).<br>Forgot it? On the server run <span class="mono">sudo nbs-console-url</span> (Linux), or open the <b>Nothing BOT Server Console</b> shortcut on the server's desktop (Windows), or use the Nothing BOT Server app (Mac).</p></div>`;
    else if (state?.update?.running || restarting) { restarting = true; render(); } // the console restarts itself during an update; keep trying
    else toast(e.message);
  }
  refreshing = false;
  // Faster while something is moving: a link waiting for approval, a model download, an update.
  clearTimeout(refresh.t);
  const busy = conn?.phase === "waiting" || conn?.phase === "installing" || aiv?.pull?.done === false || state?.update?.running || restarting || stor?.move?.phase === "running" || stor?.move?.phase === "cleaning";
  refresh.t = setTimeout(() => refresh(), busy ? 1500 : 5000);
}
